[project]
name = "polypulse"
version = "0.1.0"
description = "Real-time wallet analytics and PnL engine for Polymarket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "greenlet>=3.0.3", # Required by SQLAlchemy asyncio engine
    "httpx>=0.27.0",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["benchmark: latency benchmark excluded from the default test suite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
