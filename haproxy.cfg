global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h

resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend http_in
    bind :8080
    default_backend api_servers

backend api_servers
    balance leastconn
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker_dns init-addr last,libc,none
    server api1 api1:8000 check
    server api2 api2:8000 check
